services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flareguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flareguard}
      POSTGRES_DB: ${POSTGRES_DB:-flareguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flareguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flareguard} -d ${POSTGRES_DB:-flareguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://flareguard:flareguard@db:5432/flareguard
      WEB_RISK_ENABLED: ${WEB_RISK_ENABLED:-true}
      GOOGLE_WEB_RISK_API_KEY: ${GOOGLE_WEB_RISK_API_KEY:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-5.0}
      RDAP_TIMEOUT_SECONDS: ${RDAP_TIMEOUT_SECONDS:-4.0}
      RDAP_CACHE_TTL_SECONDS: ${RDAP_CACHE_TTL_SECONDS:-86400}
      ASSESSMENT_CACHE_TTL_SECONDS: ${ASSESSMENT_CACHE_TTL_SECONDS:-1800}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-2048}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  flareguard_pgdata:
