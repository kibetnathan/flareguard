<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flareguard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <header class="top">
      <h1>Flareguard</h1>
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M7.5 3a2 2 0 0 0-2 1.6L4.2 10.2A5 5 0 0 0 2 14.5 4.5 4.5 0 0 0 6.5 19 4.5 4.5 0 0 0 11 14.5V8.5h2v6a4.5 4.5 0 0 0 4.5 4.5 4.5 4.5 0 0 0 4.5-4.5 5 5 0 0 0-2.2-4.3l-1.3-5.6A2 2 0 0 0 16.5 3H14v3.5h-4V3H7.5Zm-1 9.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm11 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
      </svg>
    </header>

    <p class="stat">
      <span class="stat-label">Threats stopped:</span>
      <strong id="count" class="stat-count">0</strong>
    </p>

    <button id="scan" class="scan" type="button">Scan webpage</button>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <footer class="bottom">
      <a id="help" class="help" href="#">Help</a>
      <nav class="tools" aria-label="Flareguard tools">
        <button type="button" data-action="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" d="M10.49 4.55 L10.70 2.08 L13.30 2.08 L13.51 4.55 L16.20 5.67 L18.09 4.07 L19.93 5.91 L18.33 7.80 L19.45 10.49 L21.92 10.70 L21.92 13.30 L19.45 13.51 L18.33 16.20 L19.93 18.09 L18.09 19.93 L16.20 18.33 L13.51 19.45 L13.30 21.92 L10.70 21.92 L10.49 19.45 L7.80 18.33 L5.91 19.93 L4.07 18.09 L5.67 16.20 L4.55 13.51 L2.08 13.30 L2.08 10.70 L4.55 10.49 L5.67 7.80 L4.07 5.91 L5.91 4.07 L7.80 5.67Z M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z"/></svg>
        </button>
        <button type="button" data-action="logs" aria-label="Script logs" title="Script logs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 4.5h12a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 18 19.5H6A1.5 1.5 0 0 1 4.5 18V6A1.5 1.5 0 0 1 6 4.5Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 9h8M8 12h8M8 15h5"/></svg>
        </button>
        <button type="button" data-action="account" aria-label="Account" title="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9ZM3.5 20c0-3 2.4-5 5.5-5h6c3.1 0 5.5 2 5.5 5v1.5h-17V20Z"/></svg>
        </button>
        <button type="button" data-action="blocked" class="danger" aria-label="Blocked sites" title="Blocked sites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 18 18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" data-action="report" aria-label="Report a problem" title="Report a problem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 3.5h14a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2h-6l-4.5 4.5V16H5a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path fill="currentColor" d="M11 6.5h2v5h-2zM11 12.8h2v2h-2z"/></svg>
        </button>
      </nav>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
